<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fingerprint Cloud Gallery - LAN Viewer</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;background:#eef1f5;color:#172033;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #dce2e8;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 6px 24px #0000000a}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:220px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:10px 12px;border:1px solid #cfd6df;border-radius:8px}button{padding:10px 14px;border-radius:9px;border:1px solid #cdd5df;background:#fff;cursor:pointer;font-weight:700}.primary{background:#174b87;color:#fff;border-color:#174b87}.status{margin-top:12px;padding:10px 12px;border-radius:8px;background:#f7f9fb}.ok{background:#ecfdf3;color:#166534}.err{background:#fff0f0;color:#a21d1d}.hidden{display:none}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.item{border:1px solid #dfe4ea;border-radius:12px;overflow:hidden;background:#fff}.item img{width:100%;height:230px;object-fit:contain;background:#111}.body{padding:12px}.body strong{display:block;font-size:16px}.meta{color:#667085;font-size:12px;line-height:1.7}.actions{display:flex;gap:7px;margin-top:10px}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#ecfdf3;color:#166534;font-size:11px;font-weight:700}.empty{text-align:center;padding:40px;color:#667085}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 style="margin:0 0 6px">Fingerprint Cloud Gallery</h1>
    <div style="color:#667085">Viewer สำหรับคอมอีกเครื่องใน LAN — อ่าน Firestore โดยตรง</div>
  </div>

  <div class="card" id="loginCard">
    <h2 style="margin-top:0">เข้าสู่ระบบ Firebase</h2>
    <div class="top">
      <div class="field"><label>Email</label><input id="email" type="email" placeholder="อีเมล Test Firebase"></div>
      <div class="field"><label>Password</label><input id="password" type="password"></div>
      <button class="primary" id="login">เข้าสู่ระบบ</button>
    </div>
    <div id="loginStatus" class="status">ยังไม่ได้ Login</div>
  </div>

  <div class="card hidden" id="searchCard">
    <div class="top">
      <div class="field"><label>รหัสลูกค้า (PersonCode)</label><input id="personCode" value="P000002" placeholder="เช่น P000002"></div>
      <button class="primary" id="search">ค้นหา</button>
    </div>
    <div id="status" class="status">ยังไม่ได้ค้นหา</div>
  </div>

  <div class="card hidden" id="resultCard">
    <h2 style="margin-top:0">ผลการค้นหา</h2>
    <div id="summary" style="color:#667085;margin-bottom:14px"></div>
    <div id="results" class="list"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
  import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';

  const firebaseConfig={
    apiKey:'AIzaSyDtqrlZRoQ5EjBxLdIklHm3RbZPPlywCzQ',
    authDomain:'fingerprintsystemmbt.firebaseapp.com',
    projectId:'fingerprintsystemmbt',
    storageBucket:'fingerprintsystemmbt.firebasestorage.app',
    messagingSenderId:'225601369153',
    appId:'1:225601369153:web:d333a7872cdc026319c2c0'
  };

  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  const db=getFirestore(app);
  const $=id=>document.getElementById(id);
  const value=(d,k)=>d && d[k] !== undefined ? d[k] : '';
  const driveViewUrl=id=>`https://drive.google.com/file/d/${encodeURIComponent(id)}/view?usp=drivesdk`;
  const driveImageUrl=id=>`https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`;
  const setStatus=(text,ok=true)=>{const el=$('status');el.textContent=text;el.className='status '+(ok?'ok':'err')};

  $('login').onclick=async()=>{
    try{
      const r=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);
      $('loginStatus').className='status ok';
      $('loginStatus').textContent=`Login สำเร็จ: ${r.user.email}`;
    }catch(e){
      $('loginStatus').className='status err';
      $('loginStatus').textContent='Login ไม่สำเร็จ: '+e.message;
    }
  };

  $('search').onclick=async()=>{
    const code=$('personCode').value.trim();
    if(!code){setStatus('กรุณาระบุ PersonCode',false);return}
    if(!auth.currentUser){setStatus('กรุณา Login Firebase ก่อน',false);return}
    setStatus('กำลังอ่าน Firestore...');
    $('resultCard').classList.add('hidden');
    try{
      const q=query(collection(db,'fingerprints'),where('personCode','==',code));
      const snap=await getDocs(q);
      const rows=[];
      snap.forEach(doc=>rows.push({id:doc.id,data:doc.data()}));
      rows.sort((a,b)=>String(value(b.data,'capturedAtUtc')).localeCompare(String(value(a.data,'capturedAtUtc'))));
      $('resultCard').classList.remove('hidden');
      $('summary').textContent=`พบ ${rows.length} รายการจาก Firestore`;
      if(!rows.length){$('results').innerHTML='<div class="empty">ไม่พบข้อมูล</div>'}else{
        $('results').innerHTML=rows.map(r=>{
          const d=r.data, id=value(d,'driveFileId');
          return `<article class="item">
            <img src="${driveImageUrl(id)}" alt="${value(d,'fingerCode')}" onerror="this.style.display='none'">
            <div class="body">
              <strong>${value(d,'personCode')} — ${value(d,'firstName')} ${value(d,'lastName')}</strong>
              <div class="meta">นิ้ว: <b>${value(d,'fingerCode')}</b> · ตำแหน่ง: <b>${value(d,'position')}</b> · #${value(d,'sequenceNo')}<br>สถานะ: <span class="pill">${value(d,'syncStatus')}</span><br>DriveFileId: ${id}</div>
              <div class="actions"><a href="${driveViewUrl(id)}" target="_blank" rel="noopener"><button class="primary">เปิด Google Drive</button></a></div>
            </div>
          </article>`;
        }).join('');
      }
      setStatus(`อ่าน Firestore สำเร็จ: ${rows.length} รายการ`,true);
    }catch(e){setStatus('อ่าน Firestore ไม่สำเร็จ: '+e.message,false)}
  };

  onAuthStateChanged(auth,user=>{
    if(user){$('loginCard').classList.add('hidden');$('searchCard').classList.remove('hidden');}
    else{$('loginCard').classList.remove('hidden');$('searchCard').classList.add('hidden');$('resultCard').classList.add('hidden')}
  });
</script>
</body>
</html>
